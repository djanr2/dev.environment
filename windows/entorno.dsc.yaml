# yaml-language-server: $schema=https://aka.ms/configuration-dsc-schema/0.2
properties:
  configurationVersion: 0.2.0
  resources:

    # --- Editor principal ---
    - resource: Microsoft.WinGet.DSC/WinGetPackage
      id: vscode
      directives:
        description: Instalar Visual Studio Code
      settings:
        id: Microsoft.VisualStudioCode
        source: winget

    # --- Fuente para terminal ---
    - resource: Microsoft.WinGet.DSC/WinGetPackage
      id: cascadia-code-nf
      directives:
        description: Instalar Cascadia Code Nerd Font
      settings:
        id: DEVCOM.JetBrainsMonoNerdFont # o el paquete oficial de Cascadia Code NF disponible en winget
        source: winget

    # --- Navegador ---
    - resource: Microsoft.WinGet.DSC/WinGetPackage
      id: brave
      directives:
        description: Instalar Brave
      settings:
        id: Brave.Brave
        source: winget

    - resource: Microsoft.WinGet.DSC/WinGetPackage
      id: chrome
      directives:
        description: Instalar Chrome (necesario para testing/QA tooling)
      settings:
        id: Google.Chrome
        source: winget

    # --- WSL ---
    # Usa PSDscResources/Script para correr `wsl --install` en lugar del paquete WinGet
    # (Microsoft.WSL falla si las features de Windows aún no están habilitadas).
    # --no-launch evita que WSL intente abrir Ubuntu e interactuar con el usuario.
    # Si requiere reinicio, DSC termina el resto y WSL queda activo tras reiniciar.
    - resource: PSDscResources/Script
      id: wsl
      directives:
        description: Instalar WSL via wsl --install
      settings:
        GetScript: |
          @{ Result = (Get-WindowsOptionalFeature -Online -FeatureName Microsoft-Windows-Subsystem-Linux).State }
        TestScript: |
          (Get-WindowsOptionalFeature -Online -FeatureName Microsoft-Windows-Subsystem-Linux).State -eq 'Enabled'
        SetScript: |
          wsl --install --no-launch
