# yaml-language-server: $schema=https://aka.ms/configuration-dsc-schema/0.2
properties:
  configurationVersion: 0.2.0
  resources:

    # --- Editor principal ---
    - resource: Microsoft.WinGet.DSC/WinGetPackage
      id: vscode
      directives:
        description: Instalar Visual Studio Code
      settings:
        id: Microsoft.VisualStudioCode
        source: winget

    # --- Fuente para terminal ---
    # PENDIENTE: se quitó el WinGetPackage de Cascadia Code Nerd Font.
    # No se encontró un id de winget confirmado (ni DEVCOM.CascadiaCodeNerdFont
    # ni DEVCOM.CaskaydiaCoveNerdFont existen en el repositorio de winget-pkgs,
    # y nerdfonts.com no lista winget como canal de distribución oficial).
    # Instalar manualmente por ahora: https://www.nerdfonts.com/font-downloads
    # (CaskaydiaCove) o correr `winget search "nerd font"` para confirmar un id
    # válido y volver a agregar este resource.

    # --- Navegador ---
    - resource: Microsoft.WinGet.DSC/WinGetPackage
      id: brave
      directives:
        description: Instalar Brave
      settings:
        id: Brave.Brave
        source: winget

    - resource: Microsoft.WinGet.DSC/WinGetPackage
      id: chrome
      directives:
        description: Instalar Chrome (necesario para testing/QA tooling)
      settings:
        id: Google.Chrome
        source: winget

    # --- WSL / Ubuntu (bootstrap) ---
    - resource: Microsoft.WinGet.DSC/WinGetPackage
      id: wsl
      directives:
        description: Habilitar WSL
      settings:
        id: Microsoft.WSL
        source: winget
