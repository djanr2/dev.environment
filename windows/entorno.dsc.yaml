# yaml-language-server: $schema=https://aka.ms/configuration-dsc-schema/0.2
properties:
  configurationVersion: 0.2.0
  resources:

    # --- Editor principal ---
    - resource: Microsoft.WinGet.DSC/WinGetPackage
      id: vscode
      directives:
        description: Instalar Visual Studio Code
      settings:
        id: Microsoft.VisualStudioCode
        source: winget

    # --- Fuente para terminal ---
    # No se agrega como WinGetPackage: ya tienes Hack Nerd Font instalada en
    # Windows (la usas con starship). El lado WSL usa la misma fuente vía Nix
    # (ver wsl-nix/home.nix). Si en algún momento reinstalas Windows desde
    # cero, corre `winget search "hack nerd font"` para confirmar un id o
    # instálala manualmente desde https://www.nerdfonts.com/font-downloads.

    # --- Navegador ---
    - resource: Microsoft.WinGet.DSC/WinGetPackage
      id: brave
      directives:
        description: Instalar Brave
      settings:
        id: Brave.Brave
        source: winget

    - resource: Microsoft.WinGet.DSC/WinGetPackage
      id: chrome
      directives:
        description: Instalar Chrome (necesario para testing/QA tooling)
      settings:
        id: Google.Chrome
        source: winget

    # --- WSL / Ubuntu (bootstrap) ---
    - resource: Microsoft.WinGet.DSC/WinGetPackage
      id: wsl
      directives:
        description: Habilitar WSL
      settings:
        id: Microsoft.WSL
        source: winget
