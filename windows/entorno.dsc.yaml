# yaml-language-server: $schema=https://aka.ms/configuration-dsc-schema/0.2
properties:
  configurationVersion: 0.2.0
  resources:

    # --- Editor principal ---
    - resource: Microsoft.WinGet.DSC/WinGetPackage
      id: vscode
      directives:
        description: Instalar Visual Studio Code
      settings:
        id: Microsoft.VisualStudioCode
        source: winget

    # --- Fuente para terminal ---
    - resource: Microsoft.WinGet.DSC/WinGetPackage
      id: cascadia-code-nf
      directives:
        description: Instalar Cascadia Code Nerd Font
      settings:
        id: DEVCOM.JetBrainsMonoNerdFont # o el paquete oficial de Cascadia Code NF disponible en winget
        source: winget

    # --- Navegador ---
    - resource: Microsoft.WinGet.DSC/WinGetPackage
      id: brave
      directives:
        description: Instalar Brave
      settings:
        id: Brave.Brave
        source: winget

    - resource: Microsoft.WinGet.DSC/WinGetPackage
      id: chrome
      directives:
        description: Instalar Chrome (necesario para testing/QA tooling)
      settings:
        id: Google.Chrome
        source: winget